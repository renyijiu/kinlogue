name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real medical records, screenshots of user data, private paths, logs containing content, credentials, recovery codes, or `.kinloguebackup` files. Reproduce with synthetic data. Security vulnerabilities must use private vulnerability reporting.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior without private data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction using generated or synthetic input.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kinlogue version or source revision
      placeholder: v0.5.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and hardware
      placeholder: macOS 15.x, Apple silicon
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed real medical or identifying information.
          required: true
        - label: This report is not a security vulnerability.
          required: true
