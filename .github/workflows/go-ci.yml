name: Go preview CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and verify Go preview
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOENV: "off"
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache-dependency-path: |
            go.sum
            third_party/mygo/go.sum

      - name: Check toolchain and formatting
        run: |
          test "$(uname -m)" = arm64
          test "$(go version)" = 'go version go1.27.2 darwin/arm64'
          test -z "$(gofmt -l cmd internal packaging/go-preview third_party/mygo)"

      - name: Verify locked modules and inspect Go code
        run: |
          go mod verify
          go vet ./...
          (cd third_party/mygo && go mod verify && go vet ./ui)

      - name: Test production configuration and local mygo patch
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          (cd third_party/mygo && go test ./ui)

      - name: Check application concurrency
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/lan ./internal/library ./internal/backup ./internal/app ./internal/desktop ./internal/macos

      - name: Build and verify sandbox preview
        run: |
          scripts/build-go-preview.sh
          scripts/verify-go-preview.sh

      - name: Enforce privacy and documentation gates
        run: |
          scripts/privacy-guard.sh
          scripts/verify-docs.sh
