name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and verify bundle
    runs-on: macos-26
    timeout-minutes: 30
    env:
      KINLOGUE_BUILD_JOBS: "2"
      KINLOGUE_PRIMARY_TEST_TIMEOUT_SECONDS: "1200"
      KINLOGUE_ISOLATED_TEST_TIMEOUT_SECONDS: "180"
      KINLOGUE_PRIMARY_TEST_PARTITION: "0/3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install pinned ripgrep for acceptance scans
        run: |
          scripts/install-ci-ripgrep.sh
          printf '%s\n' "$GITHUB_WORKSPACE/.build/ci-tools/bin" >> "$GITHUB_PATH"

      - name: Lint Swift sources and package graph
        run: scripts/lint.sh

      - name: Enforce privacy disclosures and fixture policy
        run: |
          scripts/privacy-guard.sh
          scripts/privacy-history-guard.sh --ref HEAD

      - name: Run the full test suite
        run: scripts/test.sh

      - name: Build and verify the release bundle
        run: scripts/verify-app.sh --require-clean-source

      - name: Verify the DICOM decoder XPC runtime boundary
        run: scripts/verify-dicom-xpc.sh --use-verified-app

  complementary-tests:
    name: Complementary test partition
    runs-on: macos-26
    timeout-minutes: 30
    env:
      KINLOGUE_BUILD_JOBS: "2"
      KINLOGUE_PRIMARY_TEST_TIMEOUT_SECONDS: "1200"
      KINLOGUE_ISOLATED_TEST_TIMEOUT_SECONDS: "180"
      KINLOGUE_PRIMARY_TEST_PARTITION: "1/3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run the complementary test partition
        run: scripts/test.sh

  dedicated-lan-derived-tests:
    name: Dedicated LAN derived-artifact tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      KINLOGUE_BUILD_JOBS: "2"
      KINLOGUE_PRIMARY_TEST_TIMEOUT_SECONDS: "1200"
      KINLOGUE_ISOLATED_TEST_TIMEOUT_SECONDS: "180"
      KINLOGUE_PRIMARY_TEST_PARTITION: "2/3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run the dedicated LAN derived-artifact tests
        run: scripts/test.sh
