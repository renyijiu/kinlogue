version: 2

updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      swift-packages:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
